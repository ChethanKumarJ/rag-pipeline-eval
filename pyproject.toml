[project]
name = "rag-pipeline-eval"
version = "0.1.0"
description = "Production RAG pipeline with eval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "chromadb>=0.5.0",
    "ragas>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest", "deepeval"]
